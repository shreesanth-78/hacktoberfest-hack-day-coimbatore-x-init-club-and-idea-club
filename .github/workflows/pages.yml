# Publishes a PREVIEW of the game to GitHub Pages: the screens and the scripted mock guardians, with no backend
# and no model, so it keeps working when every laptop is off. The real game (Gemma 4 through the backend) is not
# part of it. One-time setup by the repository owner: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build the preview (mock guardians, no backend)
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          cp dist/index.html dist/404.html   # Pages has no single-page-app routing, so unknown paths load the app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
